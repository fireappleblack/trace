# Served by the unprivileged nginx image → listen on 8080 (non-root, no
# privileged port). The Service maps :80 → :8080.
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. NOTE: no strict Content-Security-Policy here on purpose —
    # the app pulls jsPDF / html2canvas / qrcode from cdnjs + jsdelivr at runtime,
    # and a tight CSP would block them. To add a CSP later, first vendor those
    # three libraries into the image (see README) so the app is self-contained.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # Cheap liveness endpoint (no app logic) for the k8s probes.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Single-page app: everything resolves to the one HTML file.
    location / {
        try_files $uri /index.html;
    }
}
