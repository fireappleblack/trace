# ─────────────────────────────────────────────────────────────────────────
# Trace — application (apply this SECOND, after postgres.yaml)
# ─────────────────────────────────────────────────────────────────────────
#   kubectl apply -f trace-server/deploy/postgres.yaml   # database first
#   kubectl apply -f trace-server/deploy/trace-k8s.yaml  # then the app
#
# The app talks to the dedicated Postgres defined in postgres.yaml. It reads
# DATABASE_URL from the `trace-db` Secret (created by postgres.yaml) and waits
# for the database to be reachable before serving. Because state now lives in
# Postgres, the app is stateless and can run multiple replicas.
#
# The `trace` namespace is created by postgres.yaml — apply that first.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace
  namespace: trace
  labels:
    app: trace
spec:
  # Stateless now (all state is in Postgres), so it scales horizontally.
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: trace
  template:
    metadata:
      labels:
        app: trace
    spec:
      # The app image is a PRIVATE package on GHCR, so the cluster needs a pull
      # credential. Create it once (it's not in git):
      #   kubectl -n trace create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=fireappleblack \
      #     --docker-password=$CR_PAT
      # (The public postgres:16-alpine initContainer below doesn't need it.)
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Block startup until Postgres accepts connections. The app ALSO retries
      # on its own (POSTGRES_CONNECT_RETRIES), so this is belt-and-braces — it
      # just makes `kubectl rollout status` clean instead of showing the app
      # crash-loop briefly while the DB warms up.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h trace-postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trace-db
                  key: POSTGRES_USER
      containers:
        - name: trace
          # Bootstrap tag for the first `kubectl apply`. Thereafter deploy.sh
          # bumps the live tag with `kubectl set image`, so this line drifts
          # behind the running version — that's expected. Keep it at a tag that
          # actually exists in GHCR so a fresh apply can pull.
          image: ghcr.io/fireappleblack/trace:v0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          # Credentials come from the Secret (POSTGRES_USER/PASSWORD/DB); the
          # app assembles and percent-encodes the connection URL itself from
          # these plus the host/port below. No DATABASE_URL is set, so any
          # password works without URL-escaping.
          envFrom:
            - secretRef:
                name: trace-db
          env:
            - name: POSTGRES_HOST
              value: trace-postgres
            - name: POSTGRES_PORT
              value: "5432"
            # How long the app retries the DB at startup before giving up
            # (30 attempts × 2s ≈ 60s). The initContainer usually means the DB
            # is already up by the time the app starts.
            - name: POSTGRES_CONNECT_RETRIES
              value: "30"
            - name: POSTGRES_CONNECT_DELAY
              value: "2"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trace
  namespace: trace
  labels:
    app: trace
spec:
  type: ClusterIP
  selector:
    app: trace
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Traefik ingress (bundled with k3s), now with Let's Encrypt TLS via
# cert-manager. cert-manager watches this Ingress, sees the cluster-issuer
# annotation + the tls block, obtains a certificate covering every host in
# the tls block over HTTP-01, and stores it in the `trace-tls` Secret, which
# Traefik then serves.
#
# Multi-domain: all three hostnames below resolve to the same node IP and are
# served by the same app. They share ONE certificate (the three names become
# Subject Alternative Names on a single cert). Trade-off of sharing: the names
# are publicly linked in Certificate Transparency logs, and a DNS break on any
# one of them can stall renewal of the shared cert. To decouple them instead,
# give each host its own `tls:` entry with a distinct `secretName`.
#
# Start with the STAGING issuer to prove the flow without hitting Let's
# Encrypt's production rate limits, then switch the annotation to
# `letsencrypt-prod` and re-issue (see README runbook).
#
# Requires, for EACH host: a DNS A record → the node's public IP, resolving
# BEFORE this is applied (every name is validated independently — one missing
# record stalls the whole cert), and ports 80+443 open to the internet on
# that node.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trace
  namespace: trace
  labels:
    app: trace
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging   # → letsencrypt-prod once verified
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zip.hsabren.co.uk
        - zip.derangedimagination.com
        - zip.saidtheape.com
      secretName: trace-tls
  rules:
    - host: zip.hsabren.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trace
                port:
                  number: 80
    - host: zip.derangedimagination.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trace
                port:
                  number: 80
    - host: zip.saidtheape.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trace
                port:
                  number: 80
