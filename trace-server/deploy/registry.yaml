# ─────────────────────────────────────────────────────────────────────────
# A small in-cluster Docker registry for the trace app
# ─────────────────────────────────────────────────────────────────────────
#   kubectl apply -f trace-server/deploy/registry.yaml
#
# This gives you one place to push images to, that both nodes pull from — so
# the build loop stops being "save + scp ×2 + import ×2" and becomes one push.
#
# Exposed as a NodePort on 30500. You push from the Mac to
#   redland001.hsabren.co.uk:30500/trace:<version>
# and the nodes pull the same reference (a per-node rewrite in registries.yaml
# sends them to their own local NodePort — see the README steps).
#
# ⚠️  This registry has NO TLS and NO auth (anonymous push/pull). That's fine
#     on a trusted/private network, but do NOT expose port 30500 to the public
#     internet. Restrict it to your own source IP in the Oracle Cloud security
#     list (and the node firewall). If the path from your Mac to the nodes is
#     public, prefer a managed registry (e.g. GHCR) instead — see the README.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    # Recreate: the data PVC is ReadWriteOnce, so never run two at once.
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: registry
          image: registry:2          # multi-arch, includes arm64
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"           # lets you delete tags to reclaim space
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
