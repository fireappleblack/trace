# proxied-hosts.conf — the hostnames that go THROUGH Cloudflare (orange-cloud).
#
# Drives cf-proxy.sh (bypass/restore). Declarative on purpose: bypass sets
# exactly these to DNS-only and restore sets exactly these back to proxied, so
# the toggle can never accidentally touch records that must stay DNS-only —
# critically the node SSH hostnames (redland001/yellowland001.hsabren.co.uk),
# which Cloudflare cannot proxy (it only proxies HTTP/HTTPS).
#
# Format:  <zone> <hostname>
# Add a line per site as you onboard it. Lines starting with # are ignored.

# ── zip game (Trace) ──
hsabren.co.uk            zip.hsabren.co.uk
derangedimagination.com  zip.derangedimagination.com
saidtheape.com           zip.saidtheape.com

# ── WordPress / future sites (examples — uncomment & edit as you launch them) ──
# derangedimagination.com  blog.derangedimagination.com
# saidtheape.com           shop.saidtheape.com

# ── NEVER list here (must stay DNS-only / grey-cloud) ──
#   redland001.hsabren.co.uk      (node — SSH/admin, not HTTP)
#   yellowland001.hsabren.co.uk   (node — SSH/admin, not HTTP)
